services:
  - type: web
    name: cogit
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm build
    startCommand: pnpm start
    autoDeploy: false # el despliegue lo dispara .github/workflows/deploy.yml
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false # cadena de conexión de Neon
